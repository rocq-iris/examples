image: ralfjung/opam-ci:opam2

stages:
  - build
  - notify

variables:
  CPU_CORES: "10"
  OCAML: "ocaml-variants.4.14.0+options ocaml-option-flambda"

.only_branches: &only_branches
  only:
  - master@iris/examples
  - /^ci/@iris/examples

.only_mr: &only_mr
  only:
  - merge_requests

.branches_and_mr: &branches_and_mr
  only:
  - master@iris/examples
  - /^ci/@iris/examples
  - merge_requests

.template: &template
  <<: *only_branches
  stage: build
  tags:
  - fp
  script:
  - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.mpi-sws.org/iris/ci.git ci -b opam2 --depth 1
  - ci/buildjob
  cache:
    key: "$CI_JOB_NAME"
    paths:
    - _opam/
  except:
  - triggers
  - schedules
  - api

## Build jobs

# We are in Rocq's CI test suite, so better make sure we keep working with Rocq master.
build-rocq.dev:
  <<: *template
  variables:
    OCAML: "ocaml-base-compiler.4.14.0" # for faster rebuilds
    OPAM_PINS: "rocq-core version dev"

build-rocq.9.2.0:
  <<: *template
  variables:
    OPAM_PINS: "rocq-core version 9.2.0"
    DENY_WARNINGS: "1"
    MANGLE_NAMES: "1"
    # Rocq bench needs an opam package
    OPAM_PKG: "1"
  tags:
  - fp-timing

# Separate MR job that does not run on fp-timing.
build-rocq.9.2.0-mr:
  <<: *template
  <<: *only_mr
  variables:
    OPAM_PINS: "rocq-core version 9.2.0"
    MANGLE_NAMES: "1"
    DENY_WARNINGS: "1"

trigger-timing:
  <<: *template
  variables:
    OPAM_PINS: "rocq-core version 9.2.0   git+https://gitlab.mpi-sws.org/$IRIS_REPO#$IRIS_REV"
  tags:
  - fp-timing
  only:
  - triggers
  - schedules
  - api
  except:
    variables:
    - $TIMING_AD_HOC_ID == null

trigger-nightly:
  <<: *template
  variables:
    STDPP_REPO: "iris/stdpp"
    IRIS_REPO: "iris/iris"
    OPAM_PINS: "rocq-core version $NIGHTLY_COQ   git+https://gitlab.mpi-sws.org/$STDPP_REPO#$STDPP_REV   git+https://gitlab.mpi-sws.org/$IRIS_REPO#$IRIS_REV"
  except:
  only:
    refs:
    - triggers
    - schedules
    - api
    variables:
    - $TIMING_AD_HOC_ID == null


notify_on_schedule_failure:
  stage: notify
  needs: [ trigger-iris.dev ]
  tags:
  - fp
  variables:
    MATTERMOST_NOTIFICATION_USERS: "@jung @robbertkrebbers"
    NOTIFICATION_MESSAGE: "❌ **Nightly CI failed**"
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.mpi-sws.org/iris/ci.git ci -b opam2 --depth 1
    - ci/send-notification.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_failure
